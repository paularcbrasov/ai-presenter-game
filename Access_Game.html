<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acces Joc - AI Social Club</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }
        
        .participants-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        .participant-btn {
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            color: #667eea;
            transition: all 0.3s;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        
        .participant-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .info {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 30px;
            font-size: 0.95em;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 Bine ai venit!</h1>
        <div class="info">
            <strong>Apasă pe numele tău pentru a vedea ordinea de prezentare:</strong>
        </div>
        <div class="participants-list" id="participantsList"></div>
    </div>

    <script>
        const participants = [
            "Mihaela Palaloga",
            "Dan Ciprian Neculai",
            "Anca Visan-Bojora",
            "Alice Elena Radu",
            "Delia Stef",
            "Anamaria Comanita",
            "Laura Vasilachi",
            "Coralia Paunoiu",
            "Negoita Ioan",
            "Cristina Cucu",
            "Ruxandra Maftei",
            "Nicolae Gabriel",
            "Sandra Ghitescu",
            "Luciana Nemeth",
            "Sebastian Ticusan"
        ];

        const list = document.getElementById('participantsList');
        participants.forEach(participant => {
            const link = document.createElement('a');
            link.href = `AI_Presenter_Game.html?p=${encodeURIComponent(participant)}`;
            link.className = 'participant-btn';
            link.textContent = `🎬 ${participant}`;
            list.appendChild(link);
        });
    </script>
</body>
</html>
